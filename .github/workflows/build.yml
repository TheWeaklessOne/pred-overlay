name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch or PR replaces a run still going; tags always finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen  # the tests draw, but never on a screen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/constraints.txt
      - name: Install
        # Pinned versions (see the file); pyproject.toml's ranges are for development.
        run: python -m pip install -e ".[dev]" -c packaging/constraints.txt
      - name: Nothing private in the repository
        run: python tools/check_public.py
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Test
        run: python -X faulthandler -m unittest discover -s tests
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = python -c "import predoverlay; print(predoverlay.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != v$version" }
      - name: Build
        run: pyinstaller packaging/PredOverlay.spec --noconfirm
      - name: Self-test the build
        shell: pwsh
        run: |
          dist/PredOverlay/PredOverlayCLI.exe --self-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build the setup
        # Inno Setup 6 comes with the runner image; installed only if an image drops it.
        shell: pwsh
        run: |
          $version = python -c "import predoverlay; print(predoverlay.__version__)"
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc) -and -not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --version=6.7.1 -y --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source }
          & $iscc /Qp "/DAppVersion=$version" packaging/installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install, run and uninstall the setup
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/PredOverlay-v*-setup.exe | Select-Object -First 1).FullName
          $app = Join-Path $env:LOCALAPPDATA 'Programs\PredOverlay'
          # Twice: the second run goes through the update path (--quit, the old files removed).
          foreach ($run in 1, 2) {
            $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
            if ($p.ExitCode) { throw "setup run $run exited with $($p.ExitCode)" }
            & "$app\PredOverlayCLI.exe" --self-test
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $extra = (Get-ChildItem $app).Name | Where-Object { $_ -notin 'PredOverlay.exe', 'PredOverlayCLI.exe', '_internal' }
            if ($extra) { throw "the program folder holds $extra too: the updater would refuse to swap it" }
          }
          $key = 'HKCU:\' + (python -c "from predoverlay import install; print(install.SETUP_KEY)")
          $entry = Get-ItemProperty $key
          Write-Host "Apps entry: $($entry.DisplayName) $($entry.DisplayVersion) in $($entry.InstallLocation)"
          $uninstaller = (Get-ChildItem "$app.uninstall\unins*.exe" | Select-Object -First 1).FullName
          $p = Start-Process $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode) { throw "uninstall exited with $($p.ExitCode)" }
          # The uninstaller finishes in a copy of itself in TEMP.
          for ($i = 0; $i -lt 60 -and ((Test-Path $app) -or (Test-Path "$app.uninstall") -or (Test-Path $key)); $i++) { Start-Sleep 1 }
          if (Test-Path $app) { throw 'the program folder is still there after the uninstall' }
          if (Test-Path "$app.uninstall") { throw 'the uninstaller folder is still there after the uninstall' }
          if (Test-Path $key) { throw 'the Apps entry is still there after the uninstall' }
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path dist/PredOverlay -DestinationPath "PredOverlay-$tag-win64.zip"
          Copy-Item "dist/PredOverlay-$tag-setup.exe" .
          $lines = Get-ChildItem "PredOverlay-*" | ForEach-Object {
            (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name
          }
          [IO.File]::WriteAllText("SHA256SUMS.txt", ($lines -join "`n") + "`n")
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release
          path: |
            PredOverlay-*.zip
            PredOverlay-*-setup.exe
            SHA256SUMS.txt

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job publishes
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      # GitHub's own CLI, preinstalled on the runner: the one job that may write to the
      # repository runs no third-party action (every install takes what it publishes).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG" PredOverlay-*.zip PredOverlay-*-setup.exe SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "" --verify-tag
